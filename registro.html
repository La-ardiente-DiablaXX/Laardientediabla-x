
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
</head>

<body style="background:#0b0b0b;color:white;text-align:center;font-family:Arial;padding:30px">

<h1 style="color:#ff1744">Crear cuenta</h1>

<input type="email" id="email" placeholder="Correo electrónico"><br><br>

<input type="password" id="password" placeholder="Contraseña"><br><br>

<button onclick="registrar()">Registrarse</button>

<p id="mensaje"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://qhabxprmrhtfqzdluizj.supabase.co";
const supabaseKey = "sb_publishable_Ui91q_-j_xxGaT2udZBcgQ_h1RiVGFF";

const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function registrar(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const { error } = await supabase.auth.signUp({
email,
password
});

document.getElementById("mensaje").textContent =
error ? error.message : "Registro realizado. Revisa tu correo.";

}
</script>

</body>
</html>
